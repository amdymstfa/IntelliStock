spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: false

# JWT Configuration for tests
jwt:
  secret: c3VwZXJzZWNyZXRrZXlmb3J0ZXN0aW5ncHVycG9zZXMc3VwZXJzZWNyZXRrZXlmb3J0ZXN0aW5ncHVycG9zZXMc3VwZXJzZWNyZXRrZXlmb3J0ZXN0aW5ncHVycG9zZXM # dummy key
  expiration: 3600000

# Encryption Configuration for tests
encryption:
  secret-key: test-encryption-key-32-chars!!
  algorithm: AES

# AI Prediction Configuration for tests
ai:
  prediction:
    days-to-analyze: 30
    confidence-threshold: 0.70
    min-data-points: 5

logging:
  level:
    root: WARN
    com.logistics.intellistock: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

server:
  port: 0
