spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  # Disable Liquibase in tests
  liquibase:
    enabled: false

# Test encryption config
encryption:
  secret-key: test-encryption-key-32-chars!!
  algorithm: AES

# Test JWT config (not used in core tests)
jwt:
  secret: test-secret-key
  expiration: 3600000

logging:
  level:
    root: WARN
    com.logistics.intellistock: DEBUG
    org.hibernate.SQL: DEBUG
